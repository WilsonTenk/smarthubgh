<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART HUB GH</title>
  <script>
    // GitHub Pages 404 SPA redirect trick.
    // Captures the current path and redirects to index.html,
    // passing the path as a query param so the app can restore it.
    var segmentCount = 1; // 1 = one path segment in the base (e.g. /smarthubgh)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
