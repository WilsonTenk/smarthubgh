    <!-- SPA Redirect: restore path from GitHub Pages 404 redirect -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Handle ?p= redirect from 404.html
        var search = window.location.search;
        if (search) {
          var matched = search.slice(1).split('&').reduce(function(o, item) {
            var parts = item.split('='); o[parts[0]] = parts.slice(1).join('=').replace(/~and~/g,'&'); return o;
          }, {});
          if (matched.p) {
            var newUrl = window.location.pathname.slice(0, window.location.pathname.lastIndexOf('/') + 1) + matched.p.replace(/^\/+/, '');
            if (matched.q) newUrl += '?' + matched.q;
            newUrl += window.location.hash;
            window.history.replaceState(null, null, newUrl);
          }
        }
      })();
    </script>
